{% load static %}
<html>
<head>
    <title>Secret Updater</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="container">
        <h1>Secret Updater</h1>
        
        {% for secret in secrets %}
        <div class="secret-block">
            <h2>{{ secret.label }}</h2>
            <form class="secretForm" data-id="{{ secret.id }}">
                {% csrf_token %}
                <label>Value:</label>
                <textarea class="secret-value" name="value" rows="4" placeholder="Current: {{ secret.value }}" style="resize: none;"></textarea>
                <button type="submit">Save</button>
                <div class="message"></div>
            </form>
        </div>
        {% endfor %}
        
    </div>

    <script>
        document.querySelectorAll('.secretForm').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const id = form.getAttribute('data-id');
                const value = form.querySelector('.secret-value').value;
                const token = form.querySelector('[name=csrfmiddlewaretoken]').value;
                const messageDiv = form.querySelector('.message');
                
                try {
                    const response = await fetch('', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': token,
                        },
                        body: JSON.stringify({ id, value })
                    });
                    
                    const data = await response.json();
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message ' + (response.ok ? 'success' : 'error');
                } catch (err) {
                    messageDiv.textContent = 'Error: ' + err;
                    messageDiv.className = 'message error';
                }
            });
        });
    </script>
</body>
</html>
