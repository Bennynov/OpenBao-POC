<!DOCTYPE html>
<html>
<head>
    <title>Secret Updater</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        .container { max-width: 500px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .message { padding: 10px; margin-top: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { color: #666; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secret Updater</h1>
        <form id="secretForm">
            {% csrf_token %}
            <label>Secret Name: <strong>{{ secret_name }}</strong></label>
            <p class="info">Path: {{ secret_path }}</p>
            
            <label for="value">Value:</label>
            <textarea id="value" name="value" rows="4">{{ secret_value }}</textarea>
            
            <button type="submit">Save</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        document.getElementById('secretForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const value = document.getElementById('value').value;
            const token = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const messageDiv = document.getElementById('message');
            
            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': token,
                    },
                    body: JSON.stringify({ value })
                });
                
                const data = await response.json();
                messageDiv.textContent = data.message;
                messageDiv.className = 'message ' + (response.ok ? 'success' : 'error');
            } catch (err) {
                messageDiv.textContent = 'Error: ' + err;
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
